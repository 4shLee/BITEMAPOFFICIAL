ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Never serve dotfiles (.env, .git, ...) even if one ends up under the docroot
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
