services:
  db:
    image: mariadb:10.11
    container_name: bitemap-mariadb
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - bitemap_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitemap-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitemap-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    command: php artisan queue:work --tries=1 --timeout=0

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitemap-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    command: php artisan schedule:work

  web:
    image: nginx:alpine
    container_name: bitemap-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitemap-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env.docker

volumes:
  bitemap_mariadb_data:
